services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: birdchimp
      POSTGRES_PASSWORD: birdchimp
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birdchimp"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      DATABASE_URL: postgres://birdchimp:birdchimp@db/birdchimp_production
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
